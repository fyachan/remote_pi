# Cockpit release (plan 43, step 3).
#
# Trigger: tag `cockpit-v<version>` (the version MUST match pubspec.yaml).
# Produces: GitHub Release with 6 artifacts + SHA256SUMS + latest.json.
# Publishing: the final job sends latest.json + appcasts straight to rp-s3 via
# PUT /upload (Bearer RP_S3_UPLOAD_TOKEN) — see rp-s3/README.md. No manual
# gate: the release goes live as soon as the workflow finishes.
#
# Per-platform runbook: cockpit/packaging/README.md.

name: cockpit-release

on:
  push:
    tags: ["cockpit-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. cockpit-v1.0.0); must exist"
        required: true

permissions:
  contents: write

concurrency:
  group: cockpit-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  FLUTTER_VERSION: "3.44.4"

jobs:
  meta:
    name: Validate tag ↔ pubspec
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - id: v
        run: |
          VERSION="${RELEASE_TAG#cockpit-v}"
          FULL=$(grep '^version:' cockpit/pubspec.yaml | awk '{print $2}')
          PUBSPEC="${FULL%%+*}"
          BUILD="${FULL##*+}"
          if [ "$VERSION" != "$PUBSPEC" ]; then
            echo "::error::tag $RELEASE_TAG asks for $VERSION but the pubspec is at $PUBSPEC"
            exit 1
          fi
          # Plan 47: Sparkle (macOS) compares CFBundleVersion (the +n). Without a
          # build number, self-update won't detect the new version — require an
          # explicit +n.
          if [ "$BUILD" = "$FULL" ] || [ -z "$BUILD" ]; then
            echo "::error::pubspec needs a build number (e.g. $VERSION+8) for Sparkle to compare versions"
            exit 1
          fi
          # The notes Sparkle shows come from the FIRST `## ` section of the
          # CHANGELOG. Without this check, forgetting to write the section for
          # the version silently publishes the PREVIOUS version's notes — that
          # is what happened from 1.15.4 to 1.18.1: consecutive releases
          # showing the same text. Fails here (seconds) instead of after the
          # builds.
          CHANGELOG_VERSION=$(awk '/^## /{print; exit}' cockpit/CHANGELOG.md \
            | sed -E 's/^## *\[?([0-9]+\.[0-9]+\.[0-9]+)\]?.*/\1/')
          if [ "$VERSION" != "$CHANGELOG_VERSION" ]; then
            echo "::error::CHANGELOG.md starts at '$CHANGELOG_VERSION' but the release is $VERSION — write the ## [$VERSION] section at the top (that is where the update notes come from)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

  # x86_64 slice of cockpit-server (plan 58). `dart build cli` does NOT
  # cross-compile, and the macOS job's runner is Apple Silicon (arm64), so the
  # bundle would come out arm64-only and Intel Macs would fall to the
  # in-process fallback (no sidecar/remote host). This job runs on an Intel
  # runner just to produce the x64 slice of the bundle (light: only
  # `dart build cli` + the PTY dylib, no ghostty/Flutter app); the macOS job
  # merges the two with `lipo`.
  server-x64:
    name: cockpit-server (x86_64 slice)
    needs: meta
    # macOS INTEL: `dart build cli` doesn't cross-compile, so the x86_64
    # slice needs a real Intel runner. `macos-13` (the last free Intel one)
    # was RETIRED in Dec/2025 and the job sat in the queue forever — it didn't
    # fail, it just never ran, and the macos job (needs: server-x64) never
    # started.
    # `macos-15-intel` is the official replacement, the last x86_64 in
    # Actions, available until Aug/2027. After that, the Intel slice needs
    # another strategy (cross via Rosetta on an ARM runner, or drop Intel).
    runs-on: macos-15-intel
    defaults: { run: { working-directory: cockpit } }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Rust (native assets of anaki)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update || true
          rustup default stable
          cargo --version
      - name: Build x86_64 bundle
        run: |
          flutter pub get
          ./tool/build-sidecar.sh
          # Sanity: the exe HAS to be x86_64 (the runner is Intel). If it
          # comes out arm64, that's a sign of dart/emulation gone wrong —
          # abort before fooling the merge. Checks EVERY binary in bin/, not
          # just server: the macos job's lipo requires the x64 slice of each
          # one, and when the embedded CLI (bin/cockpit) only existed on the
          # arm64 side the release died further down, after ~15min of build.
          # Failing here points at the missing binary.
          for f in build/server-bundle/bin/*; do
            lipo -archs "$f"
            lipo -archs "$f" | grep -q x86_64 || {
              echo "::error::$(basename "$f") x64 came out without the x86_64 slice"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cockpit-server-x64
          path: cockpit/build/server-bundle
          retention-days: 1

  macos:
    name: macOS dmg (universal, notarized)
    needs: [meta, server-x64]
    runs-on: macos-latest
    defaults: { run: { working-directory: cockpit } }
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      SIGN_ID: "Developer ID Application: Jacob Moura (U843T2P7A2)"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The libghostty build hook compiles ghostty's dylib (pubspec: hooks >
      # user_defines > libghostty > source: compile), which requires Zig.
      # Version is FIXED on purpose — never master/latest: ghostty declares
      # minimum_zig_version 0.16.0, and floating it here would bring back the
      # class of bug that `compile` fixes (toolchain diverging from what we
      # support).
      # When ghostty bumps the minimum, the job breaks loudly and we update.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # The internal CLI (`cockpit-cli`, crate in cockpit/cli) is compiled by
      # the Xcode Run Script phase as a UNIVERSAL binary: build_cli.sh
      # produces arm64 + x86_64 and joins them with `lipo`. The runner is
      # Apple Silicon, so the Intel target needs to be installed — without it
      # the app ships without the x86_64 slice and the CLI/hooks don't work
      # on Intel Macs.
      - name: Rust + Intel target (internal CLI universal)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo --version

      - name: Download x86_64 slice of cockpit-server
        uses: actions/download-artifact@v4
        with:
          name: cockpit-server-x64
          path: cockpit/build/server-x64

      - name: Import Developer ID certificate into temporary keychain
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASS=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build · sign · notarize · zip (Sparkle) · dmg
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          flutter pub get
          flutter build macos --release
          APP="build/macos/Build/Products/Release/Cockpit.app"
          # Merge the x86_64 slice of cockpit-server (job server-x64) into the
          # arm64 bundle of the .app → universal. Re-signs each merged Mach-O
          # with SIGN_ID (lipo invalidates the signature). Done BEFORE the app
          # signatures so --deep/verify already see the universal, signed
          # bundle.
          SERVER_BUNDLE="$APP/Contents/Resources/cockpit-server-bundle"
          # Merge without signing (lipo invalidates the signature anyway);
          # the signing comes right below, with the correct entitlements.
          ./tool/lipo-server-bundle.sh "$SERVER_BUNDLE" build/server-x64
          # Re-sign the server bundle like build_server.sh: dylibs first; the
          # exe (Dart AOT) with cockpit_hook.entitlements — under hardened
          # runtime without allow-jit macOS kills it (same class as
          # cockpit-hook/cli). The --deep below doesn't touch loose Mach-O in
          # Resources/, so this signature is the one that counts.
          for f in "$SERVER_BUNDLE"/lib/*.dylib; do
            codesign --force --options runtime --timestamp -s "$SIGN_ID" "$f"
          done
          # TODO every binary in bin/, not just cockpit-server: the embedded
          # CLI (bin/cockpit, plan 60 Wave G1) came later and nobody signed
          # it. The app's `--deep` does NOT reach Mach-O in subfolders of
          # Resources/, so it arrived raw at notarization and was rejected
          # with "not signed", "no secure timestamp" and "hardened runtime not
          # enabled".
          for f in "$SERVER_BUNDLE"/bin/*; do
            codesign --force --options runtime --timestamp \
              --entitlements macos/cockpit_hook.entitlements \
              --sign "$SIGN_ID" "$f"
          done
          # Intel gate (same spirit as cockpit-cli): without the x86_64 slice
          # the sidecar/remote host don't start on Intel Macs. The server exe
          # is a Dart AOT and comes out of lipo-server-bundle.sh as TWO thin
          # files (see the script header: Dart AOT doesn't survive lipo).
          for arch in arm64 x64; do
            exe="$SERVER_BUNDLE/bin/cockpit-server-$arch"
            [ -f "$exe" ] || {
              echo "::error::cockpit-server-$arch missing from the bundle"; exit 1; }
            want=$([ "$arch" = x64 ] && echo x86_64 || echo arm64)
            lipo -archs "$exe" | grep -q "$want" || {
              echo "::error::cockpit-server-$arch is not $want"; exit 1; }
          done
          # Smoke test of the signed binary: starts the server and demands the
          # socket. It was the missing gate — the 1.28.0 universal bundle
          # passed every static check and yet NO architecture ran ("is not an
          # AOT snapshot"), leaving every terminal on the fallback.
          SMOKE="$RUNNER_TEMP/cockpit-server-smoke.sock"
          COCKPIT_PTY_DYLIB="$SERVER_BUNDLE/lib/libcockpit_pty.dylib" \
            "$SERVER_BUNDLE/bin/cockpit-server-arm64" \
            --socket "$SMOKE" --exit-on-idle 1 >"$RUNNER_TEMP/smoke.log" 2>&1 &
          for i in $(seq 1 20); do [ -S "$SMOKE" ] && break; sleep 0.5; done
          [ -S "$SMOKE" ] || {
            echo "::error::cockpit-server failed to start (broken bundle)"
            cat "$RUNNER_TEMP/smoke.log" || true
            exit 1
          }
          echo "[smoke] cockpit-server started and listening on $SMOKE"
          # Sign the .app (Developer ID + Hardened Runtime + timestamp).
          # --deep covers the nested Sparkle components (Sparkle.framework,
          # Autoupdate, Updater.app, XPCServices), a notarization
          # requirement.
          codesign --force --deep --options runtime --timestamp \
            --entitlements macos/Runner/Release.entitlements \
            --sign "$SIGN_ID" "$APP"
          # --deep re-signed cockpit-hook (Contents/Resources) WITHOUT its
          # entitlements. It's a Dart AOT exe: under hardened runtime without
          # allow-jit/allow-unsigned-executable-memory macOS kills it
          # (SIGKILL). Re-signs the helper with the right entitlements and
          # re-seals the top of the app (without --deep, to not
          # re-sign/ruin the helper again).
          codesign --force --options runtime --timestamp \
            --entitlements macos/cockpit_hook.entitlements \
            --sign "$SIGN_ID" "$APP/Contents/Resources/cockpit-hook"
          # Same case as cockpit-cli: a Dart AOT exe loose in Resources/.
          # --deep does NOT sign standalone Mach-O in Resources/ (it only
          # treats known code — frameworks/plugins/XPC), so it was shipping
          # without Developer ID, without timestamp and without hardened
          # runtime → notarization Invalid. Signs it explicitly.
          codesign --force --options runtime --timestamp \
            --entitlements macos/cockpit_hook.entitlements \
            --sign "$SIGN_ID" "$APP/Contents/Resources/cockpit-cli"
          codesign --force --options runtime --timestamp \
            --entitlements macos/Runner/Release.entitlements \
            --sign "$SIGN_ID" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # The --deep --strict above does NOT inspect loose Mach-O in
          # subfolders of Resources/ — that's how the server bundle's CLI
          # passed through raw and was only caught by Apple, 10 minutes
          # later. Verifies each one explicitly, before spending the
          # submission.
          for f in "$SERVER_BUNDLE"/bin/* "$SERVER_BUNDLE"/lib/*.dylib; do
            codesign --verify --strict --verbose=2 "$f" || {
              echo "::error::$(basename "$f") of the server bundle failed signature verification"
              exit 1
            }
          done
          # Intel gate: the CLI (which also serves the Claude hooks via
          # `cockpit hook`) needs BOTH slices. Checking the architecture
          # isn't enough — `lipo -verify_arch` passes even on a broken
          # binary — so we also execute the native slice.
          lipo -archs "$APP/Contents/Resources/cockpit-cli"
          lipo -archs "$APP/Contents/Resources/cockpit-cli" | grep -q x86_64 || {
            echo "::error::cockpit-cli came out without the x86_64 slice (Intel Macs would have no CLI/hooks)"
            exit 1
          }
          "$APP/Contents/Resources/cockpit-cli" --version
          mkdir -p dist
          echo "$APPLE_API_KEY" | base64 -d > "$RUNNER_TEMP/apikey.p8"
          notarize() {
            local out
            out=$(xcrun notarytool submit "$1" --key "$RUNNER_TEMP/apikey.p8" \
              --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait 2>&1)
            echo "$out"
            # On rejection (Invalid) the submit doesn't bring the reasons;
            # pull the log with the issues (file + reason) to diagnose
            # without manual hunting.
            if echo "$out" | grep -q "status: Invalid"; then
              local id
              id=$(echo "$out" | grep -m1 -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}')
              echo "::error::Notarization Invalid — submission $id log:"
              xcrun notarytool log "$id" --key "$RUNNER_TEMP/apikey.p8" \
                --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" || true
              return 1
            fi
          }
          # 1) Notarize the .app (submitting a zip) and staple the ticket to
          #    the bundle.
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize-app.zip"
          notarize "$RUNNER_TEMP/notarize-app.zip"
          xcrun stapler staple "$APP"
          # 2) Sparkle update artifact (plan 47): zip of the .app already
          #    notarized+stapled — Sparkle swaps the bundle in-place (zip is
          #    the recommended path, not the dmg). Does NOT go into
          #    latest.json.
          ditto -c -k --keepParent "$APP" "dist/Cockpit-${VERSION}-macos.zip"
          # 3) First-install DMG, from the already-stapled .app.
          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          DMG="dist/RemotePiCockpit-${VERSION}-macos-universal.dmg"
          hdiutil create -volname "Remote Pi Cockpit" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          rm -rf "$STAGE"
          codesign --force --timestamp --sign "$SIGN_ID" "$DMG"
          notarize "$DMG"
          xcrun stapler staple "$DMG"
          spctl -a -t open --context context:primary-signature -vv "$DMG"
          rm "$RUNNER_TEMP/apikey.p8"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          # dmg (first install) + Cockpit-<v>-macos.zip (Sparkle update).
          path: cockpit/dist/*
          if-no-files-found: error

  windows:
    name: Windows exe (x64, Inno Setup)
    needs: meta
    runs-on: windows-latest
    defaults: { run: { working-directory: cockpit, shell: bash } }
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The libghostty build hook compiles ghostty's dylib (pubspec: hooks >
      # user_defines > libghostty > source: compile), which requires Zig.
      # Version is FIXED on purpose — never master/latest: ghostty declares
      # minimum_zig_version 0.16.0, and floating it here would bring back the
      # class of bug that `compile` fixes (toolchain diverging from what we
      # support).
      # When ghostty bumps the minimum, the job breaks loudly and we update.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Prepare Fastforge and Inno Setup
        run: |
          dart pub global activate fastforge
          echo "C:\\Program Files (x86)\\Inno Setup 6" >> "$GITHUB_PATH"

      - name: Build + package
        run: |
          flutter pub get
          flutter build windows --release
          # Sidecar gate: without the cockpit-server bundle the app falls to
          # the in-process fallback and Windows would run a different
          # architecture than macOS — silently, because the fallback only
          # writes to the log.
          SRV="build/windows/x64/runner/Release/cockpit-server-bundle/bin"
          test -x "$SRV/cockpit-server.exe" || {
            echo "::error::cockpit-server.exe missing from the Windows bundle"; exit 1; }
          test -f "$SRV/cockpit_pty.dll" || {
            echo "::error::cockpit_pty.dll missing from the server bundle"; exit 1; }
          # Smoke test: starts the server and demands the endpoint
          # announcement. On Windows the transport is loopback TCP + token in
          # a rendezvous file (dart:io has no UNIX socket there) — it was
          # exactly this bind that used to blow up, leaving EVERY Windows
          # terminal on the in-process fallback after waiting out the
          # connector's backoff. --exit-on-idle ends the process by itself, so
          # the job doesn't hang.
          ENDPOINT="$RUNNER_TEMP/cockpit-server-smoke.sock"
          "$SRV/cockpit-server.exe" --socket "$ENDPOINT" --exit-on-idle 1 \
            >"$RUNNER_TEMP/smoke.log" 2>&1 &
          for i in $(seq 1 20); do [ -f "$ENDPOINT" ] && break; sleep 0.5; done
          test -f "$ENDPOINT" || {
            echo "::error::cockpit-server failed to start on Windows"
            cat "$RUNNER_TEMP/smoke.log" || true
            exit 1
          }
          grep -q '"port"' "$ENDPOINT" || {
            echo "::error::endpoint announcement without a port: $(cat "$ENDPOINT")"
            exit 1
          }
          echo "[smoke] cockpit-server announced the endpoint: $(cat "$ENDPOINT")"
          dart pub global run fastforge:main package --platform windows --targets exe
          EXE=$(find dist -name "*.exe" | head -1)
          test -n "$EXE"
          mkdir -p out
          mv "$EXE" "out/RemotePiCockpit-Setup-${VERSION}-windows-x64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: cockpit/out/*.exe
          if-no-files-found: error

  linux:
    name: Linux deb+rpm (${{ matrix.deb_arch }})
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            deb_arch: amd64
            rpm_arch: x86_64
          - runner: ubuntu-24.04-arm
            deb_arch: arm64
            rpm_arch: aarch64
    runs-on: ${{ matrix.runner }}
    # Safety net: without a cap the GitHub default is SIX HOURS. In 1.28.1 a
    # hung `apt-get` held the job for 47min (normal is ~1min) with nothing
    # flagging it; the release only moved because someone went to look. The
    # caps below turn "hung indefinitely" into "fails loudly, with log, and
    # `gh run rerun --failed` redoes just this job".
    timeout-minutes: 45
    defaults: { run: { working-directory: cockpit } }
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Flutter x64 (packaged SDK)
        if: matrix.deb_arch == 'amd64'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # There is no packaged Flutter SDK for linux-arm64 (flutter-action
      # fails on an ARM host). The supported path is to run from git: the
      # tool bootstraps itself and downloads the arm64 engine artifacts.
      - name: Flutter arm64 (via git)
        if: matrix.deb_arch == 'arm64'
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      # The libghostty build hook compiles ghostty's dylib (pubspec: hooks >
      # user_defines > libghostty > source: compile), which requires Zig.
      # Version is FIXED on purpose — never master/latest: ghostty declares
      # minimum_zig_version 0.16.0, and floating it here would bring back the
      # class of bug that `compile` fixes (toolchain diverging from what we
      # support).
      # When ghostty bumps the minimum, the job breaks loudly and we update.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: System deps (GTK, ninja, rpmbuild, libmpv)
        # Measured: 55s on amd64, 1m08s on arm64. Going past 10min here isn't
        # slowness, it's a hang — fixed package list, nothing to compile.
        timeout-minutes: 10
        env:
          # `needrestart` on ubuntu-24.04 opens an interactive prompt during
          # install and is one of the classic ways to hang a step.
          DEBIAN_FRONTEND: noninteractive
        run: |
          # A mirror stall usually passes on the second attempt; three, with
          # a cap per attempt, cost nothing next to a manual rerun. Failing
          # all three aborts HERE: going on to install with a stale index
          # trades a clear error for a "package not found" further down.
          updated=0
          for attempt in 1 2 3; do
            if timeout 120 sudo -E apt-get update; then updated=1; break; fi
            echo "apt-get update failed/expired (attempt $attempt)"
            sleep 5
          done
          [ "$updated" = 1 ] || {
            echo "::error::apt-get update failed on all 3 attempts (mirror?)"
            exit 1
          }
          # libmpv-dev: media_kit links against libmpv on Linux (plan 46).
          # Runtime declared in the packages: deb libmpv2 / rpm mpv-libs.
          # libsecret-1-dev: flutter_secure_storage on Linux (vault password,
          # plan 51). Runtime: libsecret-1-0.
          sudo -E apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev rpm libmpv-dev libsecret-1-dev
          flutter --version
          dart pub global activate fastforge

      - name: Build + package
        # Measured: 7m19s. Deliberately generous cap — this compiles Flutter,
        # the `dart build cli`, the CLI's Rust and libghostty's Zig, and a
        # cold cache legitimately inflates it.
        timeout-minutes: 30
        run: |
          flutter pub get
          flutter build linux --release
          # Sidecar gate (same reason as Windows): without the
          # cockpit-server bundle the app falls to the in-process fallback,
          # silently.
          SRV="build/linux/${{ matrix.deb_arch == 'amd64' && 'x64' || 'arm64' }}/release/bundle/cockpit-server-bundle/bin"
          test -x "$SRV/cockpit-server" || {
            echo "::error::cockpit-server missing from the Linux bundle ($SRV)"; exit 1; }
          test -f "$SRV/libcockpit_pty.so" || {
            echo "::error::libcockpit_pty.so missing from the server bundle"; exit 1; }
          # Smoke test: starts the server and demands the socket. Existing
          # and being executable doesn't prove it runs — on macOS a bundle
          # that passed every static check wouldn't start on any
          # architecture, and the app fell back to in-process PTY silently.
          # --exit-on-idle ends by itself, so the job doesn't hang.
          SOCK="$RUNNER_TEMP/cockpit-server-smoke.sock"
          COCKPIT_PTY_DYLIB="$SRV/libcockpit_pty.so" \
            "$SRV/cockpit-server" --socket "$SOCK" --exit-on-idle 1 \
            >"$RUNNER_TEMP/smoke.log" 2>&1 &
          for i in $(seq 1 20); do [ -S "$SOCK" ] && break; sleep 0.5; done
          [ -S "$SOCK" ] || {
            echo "::error::cockpit-server failed to start on Linux"
            cat "$RUNNER_TEMP/smoke.log" || true
            exit 1
          }
          echo "[smoke] cockpit-server started and listening on $SOCK"
          dart pub global run fastforge:main package --platform linux --targets deb
          dart pub global run fastforge:main package --platform linux --targets rpm
          DEB=$(find dist -name "*.deb" | head -1); test -n "$DEB"
          RPM=$(find dist -name "*.rpm" | head -1); test -n "$RPM"
          mkdir -p out
          mv "$DEB" "out/remote-pi-cockpit_${VERSION}_${{ matrix.deb_arch }}.deb"
          mv "$RPM" "out/remote-pi-cockpit-${VERSION}.${{ matrix.rpm_arch }}.rpm"

      - name: Smoke test .deb (installs on the runner itself)
        # Measured: 6s. The smoke starts the server and waits for the socket
        # with its own loop, so a short cap here is safe.
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get install -y "./out/remote-pi-cockpit_${VERSION}_${{ matrix.deb_arch }}.deb"
          dpkg -L remote-pi-cockpit | grep -m1 "\.desktop$"
          # The server bundle reached the PACKAGE (the previous gate only
          # proved it left the build). Without it the installed app runs on
          # the fallback.
          dpkg -L remote-pi-cockpit | grep -q "cockpit-server-bundle/bin/cockpit-server$" || {
            echo "::error::.deb without the cockpit-server bundle"; exit 1; }
          # And the INSTALLED binary actually starts: the only check that
          # exercises the real path (install prefix, permissions, rpath of
          # the libs alongside). The previous gate only proved the file is in
          # the package.
          INSTALLED=$(dpkg -L remote-pi-cockpit | grep -m1 "cockpit-server-bundle/bin/cockpit-server$")
          SOCK="$RUNNER_TEMP/cockpit-server-deb.sock"
          "$INSTALLED" --socket "$SOCK" --exit-on-idle 1 \
            >"$RUNNER_TEMP/deb-smoke.log" 2>&1 &
          for i in $(seq 1 20); do [ -S "$SOCK" ] && break; sleep 0.5; done
          [ -S "$SOCK" ] || {
            echo "::error::cockpit-server installed by the .deb doesn't start"
            cat "$RUNNER_TEMP/deb-smoke.log" || true
            exit 1
          }
          echo "[smoke] .deb's cockpit-server started on $SOCK"

      - name: Smoke test .rpm (container fedora:40)
        # Measured: 37s. The margin covers the image pull on a bad network
        # day.
        timeout-minutes: 10
        run: |
          # rpm -qpl queries the FILE (the package's internal name is not
          # remote-pi-cockpit — the Fastforge maker uses the pubspec name).
          docker run --rm -v "$PWD/out:/out:ro" fedora:40 bash -c \
            "dnf install -y /out/remote-pi-cockpit-${VERSION}.${{ matrix.rpm_arch }}.rpm \
             && rpm -qpl /out/remote-pi-cockpit-${VERSION}.${{ matrix.rpm_arch }}.rpm | grep -m1 '\.desktop$'"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.deb_arch }}
          path: cockpit/out/*
          if-no-files-found: error

  publish:
    name: GitHub Release + latest.json
    needs: [meta, macos, windows, linux]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      # The download brings ALL artifacts of the run, including
      # `cockpit-server-x64` — which is an INPUT of the macos job (the Intel
      # slice for the lipo), not a deliverable, and arrives as the bin/ and
      # lib/ directories. Each following step tripped over them on its own:
      # `sha256sum` with "Is a directory" and `gh release upload` trying to
      # upload a directory as an asset. Deletes them here, once, instead of
      # patching step by step.
      - name: Discard inputs (only deliverables become assets)
        run: |
          find release -mindepth 1 -maxdepth 1 -type d -print -exec rm -rf {} +
          ls -la release

      - name: Generate SHA256SUMS and latest.json
        run: |
          cd release
          # FILES only: the `cockpit-server-x64` artifact (input of the macos
          # job, not a deliverable) comes as the bin/ and lib/ directories,
          # and `sha256sum *` failed with "Is a directory" — dropping the
          # whole job under `bash -e` after all the builds had already
          # passed.
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | xargs -0 sha256sum > SHA256SUMS
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          : > artifacts.ndjson
          for f in *; do
            [ -f "$f" ] || continue   # skip the server artifact's bin/ and lib/
            case "$f" in
              *macos-universal.dmg) p=macos   a=universal fmt=dmg ;;
              *windows-x64.exe)     p=windows a=x64       fmt=exe ;;
              *_amd64.deb)          p=linux   a=x64       fmt=deb ;;
              *_arm64.deb)          p=linux   a=arm64     fmt=deb ;;
              *.x86_64.rpm)         p=linux   a=x64       fmt=rpm ;;
              *.aarch64.rpm)        p=linux   a=arm64     fmt=rpm ;;
              *) continue ;;
            esac
            jq -n --arg platform "$p" --arg arch "$a" --arg format "$fmt" \
              --arg url "$BASE/$f" \
              --arg sha256 "$(sha256sum "$f" | cut -d' ' -f1)" \
              --argjson size "$(stat -c%s "$f")" \
              '{platform:$platform, arch:$arch, format:$format, url:$url, sha256:$sha256, size:$size}' \
              >> artifacts.ndjson
          done
          COUNT=$(jq -s length artifacts.ndjson)
          if [ "$COUNT" -ne 6 ]; then
            echo "::error::expected 6 artifacts in the manifest, found $COUNT"
            exit 1
          fi
          # Notes: first section of the CHANGELOG; generic fallback. The RAW
          # markdown (with the blank lines) goes to RUNNER_TEMP — that's what
          # the appcast step converts to HTML. The `notes` in latest.json
          # stays as it is (the site renders that field as text).
          awk '/^## /{n++} n==1' ../cockpit/CHANGELOG.md | tail -n +2 \
            > "$RUNNER_TEMP/notes.md"
          NOTES=$(sed '/^$/d' "$RUNNER_TEMP/notes.md" | head -20)
          if [ -z "$NOTES" ]; then
            NOTES="Remote Pi Cockpit ${VERSION}"
            printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          fi
          jq -n --arg version "$VERSION" --arg date "$(date -u +%F)" \
            --arg notes "$NOTES" --slurpfile artifacts artifacts.ndjson \
            '{version:$version, date:$date, notes:$notes, artifacts:$artifacts}' \
            > latest.json
          rm artifacts.ndjson
          cat latest.json

      - name: Sign artifacts and generate appcasts (Sparkle/WinSparkle)
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          BUILD: ${{ needs.meta.outputs.build }}
        run: |
          # Plan 47 — signs the .app.zip (macOS) and the .exe (Windows) with
          # the SAME ed25519 key (decision E, refined): ed25519 is
          # deterministic, so PyNaCl generates the signature that Sparkle and
          # WinSparkle verify. No native tooling on the runners — only the key
          # (secret).
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pynacl
          cat > "$RUNNER_TEMP/sign.py" <<'PY'
          import base64, os, sys
          from nacl.signing import SigningKey
          seed = base64.b64decode(os.environ['SPARKLE_PRIVATE_KEY'].strip())
          data = open(sys.argv[1], 'rb').read()
          print(base64.b64encode(SigningKey(seed).sign(data).signature).decode())
          PY
          sign() { "$RUNNER_TEMP/venv/bin/python3" "$RUNNER_TEMP/sign.py" "$1"; }
          cd release
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          ZIP="Cockpit-${VERSION}-macos.zip"
          EXE="RemotePiCockpit-Setup-${VERSION}-windows-x64.exe"
          test -f "$ZIP"; test -f "$EXE"
          MAC_SIG=$(sign "$ZIP"); MAC_LEN=$(stat -c%s "$ZIP")
          WIN_SIG=$(sign "$EXE"); WIN_LEN=$(stat -c%s "$EXE")
          PUBDATE=$(date -u +"%a, %d %b %Y %H:%M:%S +0000")
          # Sparkle/WinSparkle render the <description> as HTML in a webview.
          # Throwing the CHANGELOG markdown in there made users see the `###`
          # and `**` on screen and, worse, EVERYTHING on a single line (HTML
          # collapses line breaks) — illegible. Converts to real HTML first.
          python3 ../cockpit/packaging/release_notes_html.py --selftest
          python3 ../cockpit/packaging/release_notes_html.py \
            < "$RUNNER_TEMP/notes.md" > "$RUNNER_TEMP/notes.html"
          # macOS: sparkle:version = CFBundleVersion (build +n); shortVersion = marketing.
          cat > appcast-macos.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Remote Pi Cockpit</title>
              <item>
                <title>${VERSION}</title>
                <pubDate>${PUBDATE}</pubDate>
                <sparkle:version>${BUILD}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>10.15.0</sparkle:minimumSystemVersion>
                <description><![CDATA[@@NOTES@@]]></description>
                <enclosure url="${BASE}/${ZIP}" sparkle:edSignature="${MAC_SIG}" length="${MAC_LEN}" type="application/octet-stream" />
              </item>
            </channel>
          </rss>
          XML
          # Windows: WinSparkle downloads the Inno .exe and runs it silently via
          # sparkle:installerArguments; sparkle:version = marketing version
          # (matches the ProductVersion in Runner.rc).
          cat > appcast-windows.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Remote Pi Cockpit</title>
              <item>
                <title>${VERSION}</title>
                <pubDate>${PUBDATE}</pubDate>
                <sparkle:version>${VERSION}</sparkle:version>
                <description><![CDATA[@@NOTES@@]]></description>
                <enclosure url="${BASE}/${EXE}" sparkle:edSignature="${WIN_SIG}" length="${WIN_LEN}" sparkle:os="windows" sparkle:installerArguments="/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-" type="application/octet-stream" />
              </item>
            </channel>
          </rss>
          XML
          # Injects the HTML by substitution (not by heredoc expansion): the
          # notes are free text and a `$(`, a backtick or a `]]>` in the
          # CHANGELOG would break the shell or the CDATA.
          python3 - "$RUNNER_TEMP/notes.html" appcast-macos.xml appcast-windows.xml <<'PY'
          import sys
          notes = open(sys.argv[1], encoding='utf-8').read().replace(']]>', ']]&gt;')
          for path in sys.argv[2:]:
              with open(path, encoding='utf-8') as f:
                  xml = f.read()
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(xml.replace('@@NOTES@@', notes))
          PY
          if grep -q '@@NOTES@@' appcast-macos.xml appcast-windows.xml; then
            echo "::error::notes not injected into the appcast (placeholder left behind)"
            exit 1
          fi
          echo "== appcast-macos.xml =="; cat appcast-macos.xml
          echo "== appcast-windows.xml =="; cat appcast-windows.xml

      - name: Create (or update) the GitHub Release
        run: |
          NOTES_FILE=$(mktemp)
          jq -r .notes release/latest.json > "$NOTES_FILE"
          {
            echo ""
            echo "---"
            echo "**Publishing:** \`latest.json\` + appcasts are sent automatically"
            echo "to rp-s3 at the end of the workflow (turns on the site/card"
            echo "and the Sparkle/WinSparkle self-update). If the publish step"
            echo "fails, the manual fallback is to download the 3 files from"
            echo "this release and place them in"
            echo "\`/Users/flutterando/cockpit/data/\` (see \`rp-s3/README.md\`)."
          } >> "$NOTES_FILE"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* \
              --title "Remote Pi Cockpit ${VERSION}" \
              --notes-file "$NOTES_FILE" \
              --latest
          fi
          # The "Latest" badge on the re-run too (only the create above passes
          # the flag). Idempotent.
          #
          # The repository publishes TWO release lines (cockpit-v* and app-v*)
          # and GitHub only has one "Latest" — the flag was `false` in both,
          # inherited from the app workflow, and left manual marking on every
          # release. Cockpit keeps the badge as the active line; the mobile
          # app, rare, stays without. Nothing in the project depends on the
          # /releases/latest URL (downloads go through rp-s3's latest.json and
          # the appcasts), so this is cosmetic — and the cosmetic was costing
          # manual work.
          gh release edit "$RELEASE_TAG" --latest

      # Publishes the manifests to rp-s3 (replaces the manual gate). Runs AFTER
      # the release exists on GitHub: the URLs inside latest.json/appcasts
      # point at the release assets, so publishing only makes sense with them
      # live. Appcasts first, latest.json last: the site/card only announces
      # the version when the self-update already has something to serve.
      - name: Publish manifests to rp-s3
        env:
          RP_S3_UPLOAD_TOKEN: ${{ secrets.RP_S3_UPLOAD_TOKEN }}
        run: |
          upload() {
            curl -fsS --retry 3 --retry-delay 5 -X PUT \
              -H "Authorization: Bearer ${RP_S3_UPLOAD_TOKEN}" \
              --data-binary "@release/$1" \
              "https://rp-s3.jacobmoura.work/upload/cockpit/$1"
          }
          upload appcast-macos.xml
          upload appcast-windows.xml
          upload SHA256SUMS
          upload latest.json
          echo "published: https://rp-s3.jacobmoura.work/downloads/cockpit/latest.json"

      - name: Summary
        run: |
          {
            echo "## Cockpit ${VERSION} published"
            echo ""
            echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            echo ""
            echo "Manifests published automatically to rp-s3:"
            echo "- https://rp-s3.jacobmoura.work/downloads/cockpit/latest.json"
            echo "- https://rp-s3.jacobmoura.work/downloads/cockpit/appcast-macos.xml"
            echo "- https://rp-s3.jacobmoura.work/downloads/cockpit/appcast-windows.xml"
          } >> "$GITHUB_STEP_SUMMARY"

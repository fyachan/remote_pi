# CI of Cockpit's internal CLI (Rust crate in `cockpit/cli/`).
#
# It is the binary the app materializes at ~/.cockpit/bin/cockpit and that also
# serves the Claude Code hooks (`cockpit hook`). It runs on all THREE
# platforms on purpose: the transport has a `#[cfg(unix)]` path (Unix socket)
# and a Windows path (TCP over loopback + token), and only each one's
# compiler proves both compile. The wire tests (tests/wire.rs) spin up a fake
# server and check the request that arrives — that is the contract the app
# sees.

name: cockpit-cli

on:
  push:
    branches: [main]
    paths:
      - "cockpit/cli/**"
      - ".github/workflows/cockpit-cli.yml"
  pull_request:
    paths:
      - "cockpit/cli/**"
      - ".github/workflows/cockpit-cli.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: cockpit/cli

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # Hosted runners already ship rustup/cargo; we ensure stable and the
      # components the job uses.
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
          rustup default stable
          cargo --version && rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cockpit/cli/target
          key: cargo-${{ matrix.os }}-${{ hashFiles('cockpit/cli/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.os }}-

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      # The Intel slice of macOS is the reason the port exists: the release
      # is built on Apple Silicon and has to run on Intel Macs. Here we prove
      # that it compiles and that `lipo` produces a binary that EXECUTES —
      # `lipo -verify_arch` alone passes even on a broken binary.
      - name: Universal macOS (arm64 + x86_64)
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create target/aarch64-apple-darwin/release/cockpit \
                       target/x86_64-apple-darwin/release/cockpit \
               -output /tmp/cockpit-universal
          lipo -archs /tmp/cockpit-universal
          /tmp/cockpit-universal --version
          arch -x86_64 /tmp/cockpit-universal --version
